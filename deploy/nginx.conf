# /etc/nginx/sites-available/zoneapp   ->  symlink into sites-enabled
# Run certbot after this to add TLS:  certbot --nginx -d zones.example.com

server {
    listen 80;
    server_name zones.example.com;

    # Health check stays open so uptime monitors work
    location /api/health {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # Everything else. The dashboard is behind basic auth because it is a
    # single-user internal tool - the API key alone only protects writes.
    location / {
        auth_basic "Zone Levels";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    client_max_body_size 25M;   # CSV uploads
}
