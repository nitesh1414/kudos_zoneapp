# ZoneApp vhost for a shared VPS.
# Ports 8000-8003 and 5173 are already used by other applications, so PM2 runs
# uvicorn on 127.0.0.1:8004 (see ecosystem.config.js) and nginx is the only
# public entry point. Full walkthrough: docs/DEPLOYMENT_VPS.md
#
# Install:
#   sudo cp deploy/nginx-vps.conf /etc/nginx/sites-available/zoneapp
#   sudo ln -sf /etc/nginx/sites-available/zoneapp /etc/nginx/sites-enabled/zoneapp
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    server_name zoneapp.mudrakaar.com;          # <- change to your domain or IP

    # The compiled React app is served by FastAPI itself, so everything —
    # static assets and /api — goes to the same upstream.
    location / {
        proxy_pass http://127.0.0.1:8005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # History backfills / seeding can run long.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    client_max_body_size 25M;                 # CSV upload limit used by the app

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
