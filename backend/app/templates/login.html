<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · ZoneApp</title><style>
:root{--ink:#14213d;--blue:#2156d9;--bg:#f4f7fb;--muted:#68758a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#edf3ff,#f8fafc);font:15px Inter,system-ui;color:var(--ink);min-height:100vh;display:grid;place-items:center}.box{background:white;width:min(420px,calc(100% - 32px));padding:38px;border-radius:18px;box-shadow:0 20px 60px #1b3b7720;border:1px solid #e3e9f3}.logo{font-size:22px;font-weight:800}.mark{color:var(--blue)}h1{font-size:27px;margin:30px 0 6px}.sub{color:var(--muted);margin-bottom:24px}label{display:block;font-size:13px;font-weight:650;margin:16px 0 7px}input{width:100%;padding:12px 14px;border:1px solid #ccd5e3;border-radius:9px;font:inherit}button{width:100%;margin-top:24px;padding:13px;border:0;border-radius:9px;background:var(--blue);color:white;font-weight:700;cursor:pointer}.msg{min-height:20px;color:#b42318;margin-top:14px;font-size:13px}</style></head><body><main class="box"><div class="logo"><span class="mark">Zone</span>App</div><h1>Welcome back</h1><div class="sub">Sign in to access your market workspace.</div><form id="form"><label>Username</label><input id="username" autocomplete="username" required autofocus><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button>Sign in</button><div class="msg" id="msg"></div></form></main><script>
form.onsubmit=async e=>{e.preventDefault();msg.textContent='';const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});const d=await r.json();if(r.ok)location=d.redirect;else msg.textContent=d.detail||'Unable to sign in'};
</script></body></html>
