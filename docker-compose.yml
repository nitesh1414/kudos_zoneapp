services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: zoneapp
      POSTGRES_USER: zoneapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zoneapp-local-password}
    ports:
      - "5432:5432"
    volumes:
      - zoneapp_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoneapp"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    # Values come from the repository-root .env (copy .env.example to .env).
    # Defaults after ':-' are development-only conveniences.
    environment:
      DATABASE_URL: postgresql://zoneapp:${POSTGRES_PASSWORD:-zoneapp-local-password}@db:5432/zoneapp
      ZONEAPP_ADMIN_USERNAME: ${ZONEAPP_ADMIN_USERNAME:-admin}
      ZONEAPP_ADMIN_PASSWORD: ${ZONEAPP_ADMIN_PASSWORD:-local-admin-password}
      ZONEAPP_API_KEY: ${ZONEAPP_API_KEY:-local-job-key}
      ZONEAPP_ENCRYPTION_KEY: ${ZONEAPP_ENCRYPTION_KEY:-}
      ZONEAPP_SECURE_COOKIES: "${ZONEAPP_SECURE_COOKIES:-false}"
      ZONEAPP_SYMBOL: ${ZONEAPP_SYMBOL:-NSE:NIFTY50-INDEX}
      # Broker defaults pre-filled in the admin UI; keep real values in .env.
      FYERS_CLIENT_ID: ${FYERS_CLIENT_ID:-}
      FYERS_SECRET_KEY: ${FYERS_SECRET_KEY:-}
      FYERS_REDIRECT_URI: ${FYERS_REDIRECT_URI:-https://fyers.in/}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  zoneapp_postgres:
